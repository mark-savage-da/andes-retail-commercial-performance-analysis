<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Andes Retail detailed analysis dashboard preview">
  <rect width="1200" height="680" fill="#ffffff"/>
  <style>
    .title{font-family:Segoe UI,Arial,sans-serif;font-size:42px;font-weight:700;fill:#262626}
    .label{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#555}
    .small{font-family:Segoe UI,Arial,sans-serif;font-size:12px;fill:#555}
    .tiny{font-family:Segoe UI,Arial,sans-serif;font-size:10px;fill:#555}
    .chart-title{font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;fill:#333}
    .axis{font-family:Segoe UI,Arial,sans-serif;font-size:11px;fill:#666}
    .blue{fill:#1E90FF}
    .dark{fill:#1727B8}
    .grid{stroke:#d9d9d9;stroke-width:1;stroke-dasharray:2 4}
    .table-line{stroke:#d9d9d9;stroke-width:1}
    .header{fill:#f7f7f7}
    .alt{fill:#eeeeee}
  </style>

  <text x="600" y="72" text-anchor="middle" class="title">Análisis detallado de desempeño comercial</text>

  <g transform="translate(30,110)">
    <text x="0" y="0" class="chart-title">Ingresos y ganancia por segmento de cliente</text>
    <text x="0" y="26" class="tiny">● Ganancia Total   ● Ingresos Totales</text>
    <line x1="92" y1="155" x2="1110" y2="155" class="grid"/>
    <line x1="92" y1="103" x2="1110" y2="103" class="grid"/>
    <line x1="92" y1="51" x2="1110" y2="51" class="grid"/>
    <rect x="92" y="40" width="860" height="14" class="dark"/>
    <rect x="92" y="61" width="305" height="14" class="blue"/>
    <rect x="92" y="91" width="810" height="14" class="dark"/>
    <rect x="92" y="112" width="285" height="14" class="blue"/>
    <rect x="92" y="142" width="210" height="14" class="dark"/>
    <rect x="92" y="163" width="65" height="14" class="blue"/>
    <text x="74" y="51" text-anchor="end" class="axis">Premium</text>
    <text x="74" y="103" text-anchor="end" class="axis">Estándar</text>
    <text x="74" y="154" text-anchor="end" class="axis">Económico</text>
    <text x="92" y="200" class="axis">0,0 mill.</text>
    <text x="496" y="200" text-anchor="middle" class="axis">1,5 mill.</text>
    <text x="900" y="200" text-anchor="middle" class="axis">2,5 mill.</text>
  </g>

  <g transform="translate(30,330)">
    <text x="0" y="0" class="chart-title">Ganancia por Categoría de Producto</text>
    <line x1="70" y1="118" x2="420" y2="118" class="grid"/>
    <line x1="70" y1="50" x2="420" y2="50" class="grid"/>
    <rect x="105" y="45" width="58" height="73" class="blue"/>
    <rect x="184" y="49" width="58" height="69" class="blue"/>
    <rect x="263" y="55" width="58" height="63" class="blue"/>
    <rect x="342" y="60" width="58" height="58" class="blue"/>
    <text x="134" y="138" text-anchor="middle" class="axis">Deportes</text>
    <text x="213" y="138" text-anchor="middle" class="axis">Electrónica</text>
    <text x="292" y="138" text-anchor="middle" class="axis">Hogar</text>
    <text x="371" y="138" text-anchor="middle" class="axis">Ropa</text>
    <text x="65" y="118" text-anchor="end" class="axis">0,0 mill.</text>
    <text x="65" y="50" text-anchor="end" class="axis">0,5 mill.</text>
  </g>

  <g transform="translate(610,330)">
    <text x="0" y="0" class="chart-title">Ingresos por Región</text>
    <line x1="65" y1="118" x2="430" y2="118" class="grid"/>
    <line x1="65" y1="55" x2="430" y2="55" class="grid"/>
    <rect x="105" y="38" width="75" height="80" class="blue"/>
    <rect x="225" y="43" width="75" height="75" class="blue"/>
    <rect x="345" y="50" width="75" height="68" class="blue"/>
    <text x="142" y="138" text-anchor="middle" class="axis">Norte</text>
    <text x="262" y="138" text-anchor="middle" class="axis">Centro</text>
    <text x="382" y="138" text-anchor="middle" class="axis">Sur</text>
    <text x="60" y="118" text-anchor="end" class="axis">0 mill.</text>
    <text x="60" y="55" text-anchor="end" class="axis">1 mill.</text>
  </g>

  <g transform="translate(30,495)">
    <text x="0" y="0" class="chart-title">Resumen por país, región, categoría y segmento</text>
    <rect x="0" y="20" width="620" height="26" class="header"/>
    <line x1="0" y1="46" x2="620" y2="46" class="table-line"/>
    <text x="8" y="38" class="tiny">País</text><text x="70" y="38" class="tiny">Región</text><text x="150" y="38" class="tiny">Categoría_Producto</text><text x="285" y="38" class="tiny">Segmento_Cliente</text><text x="425" y="38" class="tiny">Ingresos Totales</text><text x="535" y="38" class="tiny">Margen</text>
    <rect x="0" y="72" width="620" height="22" class="alt"/>
    <rect x="0" y="116" width="620" height="22" class="alt"/>
    <g class="tiny">
      <text x="8" y="64">Chile</text><text x="70" y="64">Centro</text><text x="150" y="64">Deportes</text><text x="285" y="64">Económico</text><text x="425" y="64">17.478,00</text><text x="535" y="64">34,76 %</text>
      <text x="8" y="86">Chile</text><text x="70" y="86">Centro</text><text x="150" y="86">Deportes</text><text x="285" y="86">Estándar</text><text x="425" y="86">84.913,00</text><text x="535" y="86">36,05 %</text>
      <text x="8" y="108">Chile</text><text x="70" y="108">Centro</text><text x="150" y="108">Deportes</text><text x="285" y="108">Premium</text><text x="425" y="108">100.095,00</text><text x="535" y="108">34,77 %</text>
      <text x="8" y="130">Chile</text><text x="70" y="130">Centro</text><text x="150" y="130">Electrónica</text><text x="285" y="130">Económico</text><text x="425" y="130">14.169,00</text><text x="535" y="130">34,55 %</text>
      <text x="8" y="152">Total</text><text x="425" y="152">5.531.994,00</text><text x="535" y="152">35,10 %</text>
    </g>
  </g>

  <g transform="translate(735,500)">
    <text x="0" y="0" class="chart-title">Filtros</text>
    <text x="0" y="35" class="label">País</text>
    <text x="135" y="35" class="label">Categoría_Producto</text>
    <text x="350" y="35" class="label">Segmento_Cliente</text>
    <g class="small">
      <rect x="0" y="56" width="14" height="14" fill="#fff" stroke="#999"/><text x="24" y="68">Chile</text>
      <rect x="0" y="86" width="14" height="14" fill="#fff" stroke="#999"/><text x="24" y="98">Colombia</text>
      <rect x="0" y="116" width="14" height="14" fill="#fff" stroke="#999"/><text x="24" y="128">Perú</text>
      <rect x="135" y="56" width="14" height="14" fill="#fff" stroke="#999"/><text x="159" y="68">Deportes</text>
      <rect x="135" y="86" width="14" height="14" fill="#fff" stroke="#999"/><text x="159" y="98">Electrónica</text>
      <rect x="135" y="116" width="14" height="14" fill="#fff" stroke="#999"/><text x="159" y="128">Hogar</text>
      <rect x="350" y="56" width="14" height="14" fill="#fff" stroke="#999"/><text x="374" y="68">Económico</text>
      <rect x="350" y="86" width="14" height="14" fill="#fff" stroke="#999"/><text x="374" y="98">Estándar</text>
      <rect x="350" y="116" width="14" height="14" fill="#fff" stroke="#999"/><text x="374" y="128">Premium</text>
    </g>
  </g>
</svg>
