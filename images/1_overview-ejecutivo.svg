<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Andes Retail executive overview dashboard preview">
  <rect width="1200" height="680" fill="#ffffff"/>
  <style>
    .title{font-family:Segoe UI,Arial,sans-serif;font-size:44px;font-weight:700;fill:#262626}
    .label{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#666}
    .small{font-family:Segoe UI,Arial,sans-serif;font-size:12px;fill:#666}
    .metric{font-family:Segoe UI,Arial,sans-serif;font-size:30px;font-weight:700;fill:#222}
    .chart-title{font-family:Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;fill:#333}
    .axis{font-family:Segoe UI,Arial,sans-serif;font-size:11px;fill:#666}
    .blue{fill:#1E90FF}
    .line{stroke:#1E90FF;stroke-width:4;fill:none;stroke-linecap:round}
    .grid{stroke:#d9d9d9;stroke-width:1;stroke-dasharray:2 4}
    .card{fill:#fff;stroke:#e8e8e8;stroke-width:1;rx:4}
  </style>

  <text x="600" y="62" text-anchor="middle" class="title">Dashboard de desempeño comercial</text>
  <text x="600" y="112" text-anchor="middle" class="title">2024–2025 Andes Retail Group</text>

  <g transform="translate(48,145)">
    <rect class="card" width="155" height="118"/>
    <text x="15" y="58" class="metric">5,53 mill.</text>
    <text x="15" y="86" class="label">Ingresos Totales</text>
  </g>
  <g transform="translate(245,145)">
    <rect class="card" width="155" height="118"/>
    <text x="15" y="58" class="metric">1,94 mill.</text>
    <text x="15" y="86" class="label">Ganancia Total</text>
  </g>
  <g transform="translate(442,145)">
    <rect class="card" width="155" height="118"/>
    <text x="15" y="58" class="metric">35,10 %</text>
    <text x="15" y="86" class="label">Margen Ganancia</text>
  </g>
  <g transform="translate(639,145)">
    <rect class="card" width="155" height="118"/>
    <text x="15" y="58" class="metric">58 mil</text>
    <text x="15" y="86" class="label">Unidades Vendidas</text>
  </g>
  <g transform="translate(836,145)">
    <rect class="card" width="155" height="118"/>
    <text x="15" y="58" class="metric">5 mil</text>
    <text x="15" y="86" class="label">Pedidos Totales</text>
  </g>
  <g transform="translate(1033,145)">
    <rect class="card" width="155" height="118"/>
    <text x="15" y="58" class="metric">4 mil</text>
    <text x="15" y="86" class="label">Clientes Únicos</text>
  </g>

  <g transform="translate(26,308)">
    <text x="0" y="0" class="chart-title">Evolución de Ingresos por Año</text>
    <line x1="12" y1="150" x2="505" y2="150" class="grid"/>
    <line x1="12" y1="92" x2="505" y2="92" class="grid"/>
    <line x1="12" y1="34" x2="505" y2="34" class="grid"/>
    <polyline class="line" points="12,34 505,112"/>
    <text x="12" y="164" class="axis">2024</text>
    <text x="505" y="164" text-anchor="end" class="axis">2025</text>
    <text x="255" y="188" text-anchor="middle" class="axis">Año</text>
    <text x="528" y="64" class="axis">2,8 mill.</text>
    <text x="528" y="124" class="axis">2,6 mill.</text>
  </g>

  <g transform="translate(635,308)">
    <text x="0" y="0" class="chart-title">Ingresos por Categoría de Producto</text>
    <line x1="55" y1="150" x2="520" y2="150" class="grid"/>
    <line x1="55" y1="75" x2="520" y2="75" class="grid"/>
    <rect x="105" y="38" width="83" height="112" class="blue"/>
    <rect x="220" y="42" width="83" height="108" class="blue"/>
    <rect x="335" y="48" width="83" height="102" class="blue"/>
    <rect x="450" y="54" width="83" height="96" class="blue"/>
    <text x="146" y="166" text-anchor="middle" class="axis">Deportes</text>
    <text x="262" y="166" text-anchor="middle" class="axis">Electrónica</text>
    <text x="377" y="166" text-anchor="middle" class="axis">Hogar</text>
    <text x="492" y="166" text-anchor="middle" class="axis">Ropa</text>
    <text x="55" y="150" text-anchor="end" class="axis">0 mill.</text>
    <text x="55" y="75" text-anchor="end" class="axis">1 mill.</text>
  </g>

  <g transform="translate(26,495)">
    <text x="0" y="0" class="chart-title">Ingresos por País</text>
    <line x1="76" y1="28" x2="540" y2="28" class="grid"/>
    <line x1="76" y1="78" x2="540" y2="78" class="grid"/>
    <line x1="76" y1="128" x2="540" y2="128" class="grid"/>
    <rect x="76" y="20" width="470" height="22" class="blue"/>
    <rect x="76" y="70" width="443" height="22" class="blue"/>
    <rect x="76" y="120" width="300" height="22" class="blue"/>
    <text x="62" y="36" text-anchor="end" class="axis">Perú</text>
    <text x="62" y="86" text-anchor="end" class="axis">Chile</text>
    <text x="62" y="136" text-anchor="end" class="axis">Colombia</text>
    <text x="76" y="166" class="axis">0,0 mill.</text>
    <text x="540" y="166" text-anchor="end" class="axis">2,0 mill.</text>
  </g>

  <g transform="translate(660,500)">
    <text x="0" y="0" class="chart-title">Filtros interactivos</text>
    <text x="0" y="35" class="label">País</text>
    <text x="165" y="35" class="label">Categoría de Producto</text>
    <text x="390" y="35" class="label">Segmento del Cliente</text>
    <g class="small">
      <rect x="0" y="56" width="14" height="14" fill="#fff" stroke="#999"/><text x="24" y="68">Chile</text>
      <rect x="0" y="86" width="14" height="14" fill="#fff" stroke="#999"/><text x="24" y="98">Colombia</text>
      <rect x="0" y="116" width="14" height="14" fill="#fff" stroke="#999"/><text x="24" y="128">Perú</text>
      <rect x="165" y="56" width="14" height="14" fill="#fff" stroke="#999"/><text x="189" y="68">Deportes</text>
      <rect x="165" y="86" width="14" height="14" fill="#fff" stroke="#999"/><text x="189" y="98">Electrónica</text>
      <rect x="165" y="116" width="14" height="14" fill="#fff" stroke="#999"/><text x="189" y="128">Hogar</text>
      <rect x="165" y="146" width="14" height="14" fill="#fff" stroke="#999"/><text x="189" y="158">Ropa</text>
      <rect x="390" y="56" width="14" height="14" fill="#fff" stroke="#999"/><text x="414" y="68">Económico</text>
      <rect x="390" y="86" width="14" height="14" fill="#fff" stroke="#999"/><text x="414" y="98">Estándar</text>
      <rect x="390" y="116" width="14" height="14" fill="#fff" stroke="#999"/><text x="414" y="128">Premium</text>
    </g>
  </g>
</svg>
